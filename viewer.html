<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visor</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;background:#0b141a;color:#e9edef;font-family:system-ui,-apple-system,sans-serif;
       min-height:100vh;display:flex;flex-direction:column}
  header{padding:16px;border-bottom:1px solid #22303a}
  h1{font-size:15px;margin:0 0 10px;font-weight:600}
  .row{display:flex;gap:8px}
  input{flex:1;padding:10px;border-radius:8px;border:1px solid #22303a;background:#111b21;
        color:#e9edef;font-size:12px}
  button{padding:10px 14px;border:0;border-radius:8px;background:#00a884;color:#06231c;
         font-weight:600;cursor:pointer}
  .status{font-size:13px;color:#8696a0;margin-top:10px}
  main{flex:1;display:grid;place-items:center;padding:16px}
  video{width:100%;max-width:820px;border-radius:14px;background:#111b21;aspect-ratio:3/4;
        object-fit:cover;display:none}
  video.on{display:block}
</style>
</head>
<body>
<header>
  <h1>Manda este link por WhatsApp. Esperando conexion...</h1>
  <div class="row">
    <input id="link" readonly>
    <button id="copy">Copiar</button>
    <button id="snap">Captura</button>
  </div>
  <div class="status" id="st">Generando enlace...</div>
</header>
<main><video id="v" playsinline autoplay></video></main>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const st = document.getElementById('st');
const v  = document.getElementById('v');
const peer = new Peer('v' + Math.random().toString(36).slice(2, 9), {
  config: { iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject',
      credential: 'openrelayproject' }
  ]}
});

peer.on('open', id => {
  document.getElementById('link').value =
    location.href.replace(/viewer\.html.*$/, 'cam.html#' + id);
  st.textContent = 'Enlace listo. Sigue esperando, no cierres la pestana.';
});

peer.on('error', e => { st.textContent = 'Error de conexion: ' + e.type; });

peer.on('call', call => {
  st.textContent = 'Conectando...';
  call.answer();
  call.on('stream', s => {
    v.srcObject = s;
    v.classList.add('on');
    st.textContent = 'En vivo.';
  });
  call.on('close', () => st.textContent = 'Se cerro la transmision.');
});

document.getElementById('copy').onclick = () => {
  const i = document.getElementById('link');
  i.select();
  navigator.clipboard.writeText(i.value);
  st.textContent = 'Enlace copiado.';
};

document.getElementById('snap').onclick = () => {
  if(!v.videoWidth) return;
  const c = document.createElement('canvas');
  c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext('2d').drawImage(v, 0, 0);
  const a = document.createElement('a');
  a.href = c.toDataURL('image/jpeg', 0.9);
  a.download = 'captura_' + Date.now() + '.jpg';
  a.click();
};
</script>
</body>
</html>
